<title>Arcade Green Room</title>

<style id="app-css">

  --ink:#333333; --ink-soft:#7A716A; --ink-faint:#A69D94;
  --line:#E9E4DE; --line-soft:#F0ECE7;
  --rose:#F8B3B5; --rose-deep:#A8555A; --tan:#F2BC79;
  --good:#16833A; --good-bg:#E4F1E7;
  --warn:#8A6420; --warn-bg:#F5EBD7;
  --bad:#A8555A; --bad-bg:#F9E7E8;
  --cur-col:#FDF2E5; --shadow:0 10px 30px rgba(51,49,46,.14);
  --font-display:'Lydian','Marcellus','Optima',serif;
  --font-body:'Akkurat','Work Sans','Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#252220; --surface:#2E2A27; --cream:#38312A; --blush:#453236;
    --ink:#F0E9E1; --ink-soft:#B7ACA2; --ink-faint:#877D74;
    --line:#453F3A; --line-soft:#3A3531;
    --rose:#F8B3B5; --rose-deep:#E29CA0; --tan:#F2BC79;
    --good:#54B478; --good-bg:#2B3B30;
    --warn:#D9A75B; --warn-bg:#3E362A;
    --bad:#E29CA0; --bad-bg:#463135;
    --cur-col:#3B342C; --shadow:0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#252220; --surface:#2E2A27; --cream:#38312A; --blush:#453236;
  --ink:#F0E9E1; --ink-soft:#B7ACA2; --ink-faint:#877D74;
  --line:#453F3A; --line-soft:#3A3531;
  --rose:#F8B3B5; --rose-deep:#E29CA0; --tan:#F2BC79;
  --good:#54B478; --good-bg:#2B3B30;
  --warn:#D9A75B; --warn-bg:#3E362A;
  --bad:#E29CA0; --bad-bg:#463135;

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:var(--font-body);cursor:pointer}
input,select,textarea{font-family:var(--font-body);font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--rose);outline-offset:1px}
input[type=number]{font-variant-numeric:tabular-nums}
a{color:var(--ink)}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px 90px}

.hdr{display:flex;align-items:center;gap:16px;padding:22px 0 14px;border-bottom:1px solid var(--line)}
.hdr svg{width:36px;height:40px;color:var(--ink);flex:none}
.hdr-title{font-family:var(--font-display);font-size:26px;letter-spacing:5px;text-transform:uppercase;font-weight:normal;margin:0;line-height:1.1}

.nav button:hover{border-color:var(--line)}
.nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* generic */

.btn{background:var(--ink);color:var(--bg);border:1px solid var(--ink);border-radius:7px;padding:8px 14px;font-size:13px}
.btn:hover{opacity:.88}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}

.btn.accent{background:var(--rose);color:#333333;border-color:var(--rose)}
.btn.small{padding:4px 10px;font-size:12px;border-radius:6px}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:11.5px;letter-spacing:.4px;white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.plain{background:var(--line-soft);color:var(--ink-soft)}
.chip.rose{background:var(--blush);color:var(--rose-deep)}
.muted{color:var(--ink-soft)} .faint{color:var(--ink-faint)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0}
.toolbar .spacer{flex:1}
table.data{width:100%;border-collapse:collapse}
table.data th{font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint);text-align:left;font-weight:normal;padding:7px 10px;border-bottom:1px solid var(--line)}
table.data td{padding:8px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
table.data tr:last-child td{border-bottom:none}
table.data td.r,table.data th.r{text-align:right}
.tblwrap{overflow-x:auto}
/* dashboard */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
table.data tr.inv-good td{background:var(--good-bg)}
table.data tr.inv-warn td{background:var(--warn-bg)}
table.data tr.inv-bad td{background:var(--bad-bg)}
table.data td input.oh{width:90px;padding:5px 7px;text-align:right}
.email-block{margin-bottom:18px}
.email-block .eb-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.email-block .eb-title{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint)}
.email-block .eb-subject{font-weight:bold;font-size:13px}
.email-block textarea{width:100%;font-family:var(--font-body);font-size:13px;line-height:1.5;tab-size:12}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.two-col{grid-template-columns:1fr}}
.switch-arrow{color:var(--rose-deep)}
/* calendar */
.cal-wrap{overflow:auto;max-height:calc(100vh - 210px);border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.cal{border-collapse:separate;border-spacing:0;font-size:12px}
table.cal th,table.cal td{border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);padding:6px 8px;min-width:112px;max-width:112px;white-space:normal}
table.cal thead th{position:sticky;top:0;z-index:3;background:var(--surface);font-weight:normal;text-align:left;font-size:11px;color:var(--ink-soft);border-bottom:1px solid var(--line)}
table.cal thead th .wk{display:block;color:var(--ink-faint);font-size:10px;letter-spacing:.5px}
table.cal .rowlabel{position:sticky;left:0;z-index:2;background:var(--surface);min-width:190px;max-width:190px;border-right:1px solid var(--line);font-size:12.5px}
table.cal thead .rowlabel{z-index:4}
table.cal .rowlabel .comp{color:var(--ink-soft)}
table.cal tr.secrow td{background:var(--cream);border-bottom:1px solid var(--line)}
table.cal tr.secrow td.rowlabel{background:var(--cream);font-family:var(--font-display);letter-spacing:2px;text-transform:uppercase;font-size:12.5px;white-space:nowrap}
table.cal tr.secrow td .sub{font-family:var(--font-body);letter-spacing:.3px;text-transform:none;color:var(--ink-soft);font-size:11px;margin-left:8px}

.legend{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--ink-soft);flex-wrap:wrap}
.legend .sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line)}
/* position */
.imp-group{margin-bottom:18px}
.imp-head{display:flex;align-items:baseline;gap:10px;padding:8px 4px;border-bottom:2px solid var(--ink)}
.imp-head .nm{font-family:var(--font-display);letter-spacing:2px;text-transform:uppercase;font-size:14px}
.imp-head .tot{margin-left:auto;font-size:12.5px;color:var(--ink-soft)}
.statbar{display:flex;gap:26px;flex-wrap:wrap;background:var(--cream);border-radius:12px;padding:14px 20px;margin:14px 0}
.statbar .st .v{font-family:var(--font-display);font-size:22px;letter-spacing:1px;font-variant-numeric:tabular-nums}
.statbar .st .k{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-soft)}
/* orders */
.order-card{margin-bottom:16px}
.order-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.order-head .nm{font-family:var(--font-display);letter-spacing:2px;text-transform:uppercase;font-size:15px}
.order-head .tot{margin-left:auto;font-size:13px}
.order-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
/* importers */
.imp-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.imp-card .co{font-family:var(--font-display);letter-spacing:2px;text-transform:uppercase;font-size:14px}
.imp-card .row{font-size:12.5px;margin-top:5px;color:var(--ink-soft)}
.imp-card a{color:var(--ink-soft)}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(30,28,26,.5);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);max-width:820px;width:100%;max-height:86vh;overflow:auto;padding:22px 24px}
.modal h3{font-family:var(--font-display);font-weight:normal;letter-spacing:2.5px;text-transform:uppercase;font-size:16px;margin:0 0 16px}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.frm label{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint);margin-bottom:4px}
.frm .full{grid-column:1/-1}
.frm input,.frm select,.frm textarea{width:100%}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
/* sign-in gate */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:44px 40px;text-align:center;max-width:460px;width:100%;box-shadow:var(--shadow)}
.gate-card .muted{margin-left:auto;margin-right:auto}
/* save bar + toast + banners */
.savebar{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:var(--ink);color:var(--bg);border-radius:999px;padding:9px 10px 9px 18px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);z-index:60;font-size:13px}
.savebar .btn{background:var(--rose);border-color:var(--rose);color:#333333;border-radius:999px;padding:6px 16px}
.toast{position:fixed;right:18px;bottom:18px;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 16px;z-index:70;font-size:13px;box-shadow:var(--shadow);max-width:340px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 16px;margin:12px 0;font-size:13px;display:flex;gap:10px;align-items:center}
.banner .btn{margin-left:auto}
.foot{margin-top:60px;padding-top:16px;border-top:1px solid var(--line);color:var(--ink-faint);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (prefers-reduced-motion: no-preference){
  .modal{animation:pop .14s ease-out}
  @keyframes pop{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}
}

<div id="app"></div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc, onSnapshot, runTransaction, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js';

var firebaseConfig=__FIREBASE_CONFIG__;
var fbApp=initializeApp(firebaseConfig);
var auth=getAuth(fbApp);
var db=getFirestore(fbApp);
var STATE_REF=null, ACCESS_REF=null;

/* ---------- state ---------- */
var state=null;            /* the working copy, loaded from Firestore */
var rev=0;                 /* last revision this client has seen or written */
var lastSavedBy='';
var user=null;
var dirty=false, saving=false, saveTimer=null, unsubState=null;
var noAccess=false, offline=false;
var view=location.hash.replace('#','')||'dashboard';

function normalize(s){
  (s.sections||[]).forEach(function(sec){
    (sec.rows||[]).forEach(function(r){
      if(r.runs){ r.a=[]; r.runs.forEach(function(run){ for(var i=0;i<run[1];i++) r.a.push(run[0]); }); delete r.runs; }
      if(!r.a) r.a=[];
    });
  });
  s.orders=s.orders||[]; s.position=s.position||[]; s.importers=s.importers||[];
  s.team=s.team||{poContact:'Alex'};
  s.inventory=s.inventory||[];
  s.inventory.forEach(function(it){ if(!it.id) it.id=uid(); });
  delete s.onHand;
  return syncInventory(s);
}
/* Keep the runway in step with the calendar. Every coffee scheduled in the
   next 6 weeks is tracked automatically, so nobody has to add one by hand.
   Each slot's category usage and minimum are split across its components,
   and a coffee filling two slots at once (like Palmera) gets both shares.
   Anything edited by hand is left alone. */
var INV_WINDOW=6;
function invKey(name){ return String(name==null?'':name).trim().toLowerCase(); }
function splitCell(v){
  return String(v==null?'':v).split('/').map(function(x){return x.trim();}).filter(Boolean);
}
function curWeekIdxOf(s){
  var start=parseLocalDate(s.calendar.start);
  var t=new Date(); t=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  if(t<start) return 0;
  for(var i=0;i<s.calendar.numWeeks;i++){
    var a=new Date(start); a.setDate(a.getDate()+i*7);
    var b=new Date(a); b.setDate(b.getDate()+6);
    if(t>=a&&t<=b) return i;
  }
  return s.calendar.numWeeks-1;
}
function syncInventory(s){
  s.inventory=s.inventory||[];
  var counts={};
  s.sections.forEach(function(sec){ if(sec.usageKey&&!sec.hidden) counts[sec.usageKey]=(counts[sec.usageKey]||0)+sec.rows.length; });
  function catVal(list,key){ var m=(list||[]).filter(function(x){return x.key===key;})[0]; return m?Number(m.lbs)||0:0; }
  var cur=curWeekIdxOf(s);
  var last=Math.min(s.calendar.numWeeks-1,cur+INV_WINDOW-1);
  var seen={};
  for(var i=cur;i<=last;i++){
    var wkUse={}, wkMin={};
    s.sections.forEach(function(sec){
      if(sec.hidden) return;
      var n=sec.usageKey?(counts[sec.usageKey]||1):0;
      var uShare=sec.usageKey?catVal(s.usage,sec.usageKey)/n:0;
      var mShare=sec.usageKey?catVal(s.minimums,sec.usageKey)/n:0;
      sec.rows.forEach(function(r){
        splitCell((r.a||[])[i]).forEach(function(name){
          var k=invKey(name);
          if(!seen[k]) seen[k]={name:name,usage:0,min:0};
          wkUse[k]=(wkUse[k]||0)+uShare;
          wkMin[k]=(wkMin[k]||0)+mShare;
        });
      });
    });
    Object.keys(wkUse).forEach(function(k){
      if(wkUse[k]>seen[k].usage) seen[k].usage=wkUse[k];
      if(wkMin[k]>seen[k].min) seen[k].min=wkMin[k];
    });
  }
  var changed=false, byKey={};
  s.inventory.forEach(function(it){ byKey[invKey(it.coffee)]=it; });
  Object.keys(seen).forEach(function(k){
    var want=seen[k], it=byKey[k];
    var u=Math.round(want.usage||0), m=Math.round(want.min||0);
    if(!it){
      s.inventory.push({id:uid(),coffee:want.name,usageLbs:u,minLbs:m,onHand:null,updated:null,auto:true});
      changed=true; return;
    }
    if(!it.custom&&(it.usageLbs!==u||it.minLbs!==m)){ it.usageLbs=u; it.minLbs=m; changed=true; }
  });
  var before=s.inventory.length;
  s.inventory=s.inventory.filter(function(it){
    if(it.archived||it.custom||!it.auto) return true;
    if(seen[invKey(it.coffee)]) return true;
    return it.onHand!=null&&it.onHand!=='';
  });
  if(s.inventory.length!==before) changed=true;
  return changed;
}
/* ---------- utils ---------- */
function esc(x){ return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function money(n){ return '$'+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function lbs(n){ return (Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:1}); }
function uid(){ return 'x'+Math.random().toString(36).slice(2,9); }
function el(html){ var d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; }
function parseLocalDate(iso){ var p=iso.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function isoWeekNum(d){ var t=new Date(d.getFullYear(),d.getMonth(),d.getDate()); var day=(t.getDay()+6)%7; t.setDate(t.getDate()-day+3); var firstThu=new Date(t.getFullYear(),0,4); var fd=(firstThu.getDay()+6)%7; firstThu.setDate(firstThu.getDate()-fd+3); return 1+Math.round((t-firstThu)/(7*864e5)); }
function fmtMD(d){ return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }

var _weeks=null;
function weeks(){
  if(_weeks && _weeks.length===state.calendar.numWeeks) return _weeks;
  _weeks=[]; var start=parseLocalDate(state.calendar.start);
  for(var i=0;i<state.calendar.numWeeks;i++){
    var a=new Date(start); a.setDate(a.getDate()+i*7);
    var b=new Date(a); b.setDate(b.getDate()+6);
    _weeks.push({start:a,label:fmtMD(a)+' - '+fmtMD(b),num:isoWeekNum(a),year:a.getFullYear()});
  }
  return _weeks;
}
function curWeekIdx(){
  var w=weeks(); var t=new Date(); t=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  for(var i=0;i<w.length;i++){ var end=new Date(w[i].start); end.setDate(end.getDate()+6); if(t>=w[i].start&&t<=end) return i; }
  return t<w[0].start?0:w.length-1;
}
function cellVal(row,i){ return (row.a[i]||'').trim(); }
function isSwitch(row,i){ var v=cellVal(row,i); if(!v) return false; if(v.indexOf('/')>-1) return true; if(i===0) return false; var p=cellVal(row,i-1); return p!=='' && p.toLowerCase()!==v.toLowerCase(); }
function usageOf(key){ var u=(state.usage||[]).filter(function(x){return x.key===key;})[0]; return u?Number(u.lbs)||0:0; }
function minOf(key){ var m=(state.minimums||[]).filter(function(x){return x.key===key;})[0]; return m?Number(m.lbs)||0:0; }
function coffeeNames(){
  var names={};
  state.position.forEach(function(p){ if(!p.archived){ names[p.coffee+(p.origin?' - '+p.origin:'')]=1; names[p.coffee]=1; } });
  state.sections.forEach(function(s){ s.rows.forEach(function(r){ r.a.forEach(function(v){ if(v) names[v]=1; }); }); });
  return Object.keys(names).sort();
}

/* ---------- persistence (Firestore) ----------
   One document holds the whole state as a JSON string, with a revision
   counter. Saves are debounced and transactional; a live listener keeps
   every open screen current within seconds. Last write wins, but the
   window is tiny because saves happen moments after each edit. */
/* Anything that changes the calendar or the usage figures re-runs the
   runway sync, so tracked coffees follow the plan without anyone adding them. */
function resync(){ syncInventory(state); markDirty(); }
function markDirty(){
  if(!state) return;
  dirty=true; renderSyncStatus('pending');
  clearTimeout(saveTimer);
  saveTimer=setTimeout(save,1200);
}
function save(){
  if(!state||saving||!user) return;
  saving=true; renderSyncStatus('saving');
  state.savedAt=new Date().toISOString();
  var payload=JSON.stringify(state);
  var who=user.displayName||user.email||'someone';
  runTransaction(db,function(tx){
    return tx.get(STATE_REF).then(function(snap){
      var cur=snap.exists()?(snap.data().rev||0):0;
      tx.set(STATE_REF,{json:payload,rev:cur+1,updatedAt:serverTimestamp(),updatedBy:who});
      return cur+1;
    });
  }).then(function(newRev){
    rev=newRev; lastSavedBy=who; saving=false;
    if(dirty&&JSON.stringify(state)!==payload){ dirty=true; markDirty(); }
    else { dirty=false; renderSyncStatus('saved'); }
  }).catch(function(err){
    saving=false;
    if(err&&err.code==='permission-denied'){ noAccess=true; render(); return; }
    offline=true; renderSyncStatus('offline');
    clearTimeout(saveTimer); saveTimer=setTimeout(save,5000);
  });
}
window.addEventListener('beforeunload',function(e){ if(dirty||saving){ e.preventDefault(); e.returnValue=''; } });
window.addEventListener('online',function(){ if(dirty) save(); });

function adoptRemote(snap){
  var d=snap.data();
  if((d.rev||0)<=rev) return;
  rev=d.rev||0; lastSavedBy=d.updatedBy||'';
  if(dirty||saving) return; /* our in-flight save will land on top */
  try{
    state=JSON.parse(d.json); normalize(state); _weeks=null;
    render();
    if(lastSavedBy&&user&&lastSavedBy!==(user.displayName||user.email)) toast('Updated with '+lastSavedBy+"'s changes.");
  }catch(e){ toast('Received an update this page could not read. Refresh to be safe.'); }
}
function startListening(){
  if(unsubState) unsubState();
  unsubState=onSnapshot(STATE_REF,function(snap){
    offline=false;
    if(!snap.exists()){ state=null; renderBootstrap(); return; }
    if(state===null){
      var d=snap.data();
      rev=d.rev||0; lastSavedBy=d.updatedBy||'';
      try{ state=JSON.parse(d.json); }catch(e){ state={}; }
      var synced=normalize(state); _weeks=null; render(); if(synced) markDirty();
    } else adoptRemote(snap);
  },function(err){
    if(err&&err.code==='permission-denied'){ noAccess=true; render(); }
    else { offline=true; renderSyncStatus('offline'); }
  });
}

/* ---------- dashboard / inventory ---------- */
function invStatus(it){
  var oh=it.onHand, min=Number(it.minLbs)||0, use=Number(it.usageLbs)||0;
  if(oh==null||oh===''||isNaN(Number(oh))) return {cls:'',rank:2,chip:'<span class="chip plain">No count yet</span>',cover:null};
  oh=Number(oh);
  var cover=use?oh/use:null;
  if(oh<min) return {cls:'inv-bad',rank:0,chip:'<span class="chip bad">Order now</span>',cover:cover};
  if(oh<min*1.15) return {cls:'inv-warn',rank:1,chip:'<span class="chip warn">Getting close</span>',cover:cover};
  return {cls:'inv-good',rank:3,chip:'<span class="chip good">Covered</span>',cover:cover};
}
function usedInSlots(coffee){
  var cur=curWeekIdx(), w=weeks(), key=invKey(coffee), hits=[], soon=null;
  if(!key) return {now:hits,soonWeek:null};
  var last=Math.min(w.length-1,cur+INV_WINDOW-1);
  for(var i=cur;i<=last;i++){
    state.sections.forEach(function(sec){
      if(sec.hidden) return;
      sec.rows.forEach(function(r){
        if(splitCell(cellVal(r,i)).map(invKey).indexOf(key)<0) return;
        var label=sec.name+(sec.rows.length>1?' '+r.name:'');
        if(i===cur){ if(hits.indexOf(label)<0) hits.push(label); }
        else if(soon===null) soon=i;
      });
    });
  }
  return {now:hits,soonWeek:soon};
}
/* Find the booked position entry for a coffee, so we know its bag size.
   Calendar names carry the origin ("Acacia G2 - Ethiopia") while position
   splits it out, so fall back to matching on the name before the dash. */
function positionFor(coffee){
  var name=invKey(coffee), base=name.split(' - ')[0].trim();
  var pool=state.position.filter(function(p){ return !p.archived&&Number(p.bagWeight)>0; });
  var hit=pool.filter(function(p){ return invKey(p.coffee)===name; })[0];
  if(!hit) hit=pool.filter(function(p){ return invKey(p.coffee+(p.origin?' - '+p.origin:''))===name; })[0];
  if(!hit) hit=pool.filter(function(p){ return invKey(p.coffee).split(' - ')[0].trim()===base; })[0];
  if(!hit) hit=pool.filter(function(p){ var pk=invKey(p.coffee).split(' - ')[0].trim(); return pk&&base&&(pk.indexOf(base)===0||base.indexOf(pk)===0); })[0];
  /* last resort: same first word and the origin shows up in the calendar name,
     which is how "SWP Honduras" on the calendar finds "SWP Decaf" from Honduras */
  if(!hit){
    var w0=base.split(' ')[0];
    if(w0) hit=pool.filter(function(p){
      var o=invKey(p.origin);
      return invKey(p.coffee).split(' ')[0]===w0&&o&&name.indexOf(o)>-1;
    })[0];
  }
  return hit||null;
}
/* How much to order: enough to land one week of usage above the minimum. */
function orderAdvice(it){
  var oh=it.onHand;
  if(oh==null||oh===''||isNaN(Number(oh))) return null;
  var target=(Number(it.minLbs)||0)+(Number(it.usageLbs)||0);
  var need=target-Number(oh);
  if(need<=0) return {need:0};
  var p=positionFor(it.coffee);
  if(!p) return {need:need,bags:null};
  var bw=Number(p.bagWeight)||0;
  var bags=Math.ceil(need/bw);
  return {need:need,bags:bags,bagWeight:bw,lbs:bags*bw,importer:p.importer||'',coffee:p.coffee};
}
function adviceHTML(a){

/* ---------- calendar ---------- */
function renderCalendar(v){
  var w=weeks(), cur=curWeekIdx();
  var showHidden=v.getAttribute('data-hidden')==='1';
  var hiddenCount=state.sections.filter(function(s){return s.hidden;}).length;
  var html='<div class="toolbar"><div class="legend">'+
    '<span><span class="sw" style="background:var(--blush)"></span>Coffee switch week</span>'+
    '<span><span class="sw" style="background:var(--cur-col)"></span>Current week</span>'+
    '<span class="muted">Click any cell to set a coffee.</span></div>'+
    '<div class="spacer"></div>'+
    '<button class="btn ghost small" id="cal-today">Jump to this week</button>'+
    '<button class="btn ghost small" id="cal-addslot">Add slot</button>'+
    (hiddenCount||showHidden?'<button class="btn ghost small" id="cal-hidden">'+(showHidden?'Hide the hidden slots':'Show hidden slots ('+hiddenCount+')')+'</button>':'')+
    '<button class="btn ghost small" id="cal-extend">Add 8 weeks</button></div>';
  html+='<div class="cal-wrap"><table class="cal"><thead><tr><th class="rowlabel">2026 Calendar</th>';
  w.forEach(function(wk,i){ html+='<th class="'+(i===cur?'cur':'')+'"><span class="wk">Wk '+wk.num+(wk.year!==2026?' &middot; '+wk.year:'')+'</span>'+esc(wk.label)+'</th>'; });
  html+='</tr></thead><tbody>';
  state.sections.forEach(function(sec,si){
    if(sec.hidden&&!showHidden) return;
    var use=sec.usageKey?usageOf(sec.usageKey)+' lbs/wk':'';
    html+='<tr class="secrow"><td class="rowlabel"><div style="display:flex;align-items:center;gap:8px">'+
      '<span style="min-width:0;overflow:hidden;text-overflow:ellipsis">'+esc(sec.name)+(sec.sub?'<span class="sub">'+esc(sec.sub)+'</span>':'')+'</span>'+
      (sec.hidden?'<span class="chip plain">Hidden</span>':'')+
      '<button class="btn ghost small" data-hide="'+si+'" style="margin-left:auto;padding:1px 7px;font-size:10.5px" title="'+(sec.hidden?'Unhide this slot':'Hide this slot, keeping its history')+'">'+(sec.hidden?'Unhide':'Hide')+'</button>'+
      '</div></td><td colspan="'+w.length+'"><span class="use" style="float:left">'+esc(use)+'</span></td></tr>';
    sec.rows.forEach(function(r,ri){
      html+='<tr><td class="rowlabel"><span class="comp">'+esc(r.name)+'</span></td>';
      for(var i=0;i<w.length;i++){
        var val=cellVal(r,i);
        var cls='cell'+(val?'':' empty')+(isSwitch(r,i)?' switch':'')+(i===cur?' cur':'');
        html+='<td class="'+cls+'" data-s="'+si+'" data-r="'+ri+'" data-i="'+i+'" tabindex="0">'+(val?esc(val):'&middot;')+'</td>';
      }
      html+='</tr>';
    });
  });
  html+='</tbody></table></div>';
  v.innerHTML=html;
  var wrapEl=v.querySelector('.cal-wrap');
  function jump(){ var c=v.querySelector('th.cur'); if(c) wrapEl.scrollLeft=Math.max(0,c.offsetLeft-260); }
  jump();
  v.querySelector('#cal-today').onclick=jump;
  v.querySelector('#cal-extend').onclick=function(){ state.calendar.numWeeks+=8; _weeks=null; resync(); renderCalendar(v); toast('Calendar extended 8 weeks.'); };
  var hb=v.querySelector('#cal-hidden');
  if(hb) hb.onclick=function(){ v.setAttribute('data-hidden',showHidden?'0':'1'); renderCalendar(v); };
  v.querySelector('#cal-addslot').onclick=function(){
    var body='<div class="frm">'+
      '<div><label>Slot name</label><input id="as-name" placeholder="e.g. Holiday Blend"></div>'+
      '<div><label>Subtitle (optional)</label><input id="as-sub" placeholder="e.g. Seasonal"></div>'+
      '<div><label>Components</label><select id="as-n"><option value="1">Single coffee</option><option value="2">Two components (blend)</option></select></div>'+
    '</div>';
    openModal('Add slot',body,function(m){
      var name=m.querySelector('#as-name').value.trim();
      if(!name){ toast('Give the slot a name.'); return false; }
      var n=Number(m.querySelector('#as-n').value)||1;
      var rows=n===2?[{name:'Component 1',a:[]},{name:'Component 2',a:[]}]:[{name:'Coffee',a:[]}];
      state.sections.push({id:uid(),name:name,sub:m.querySelector('#as-sub').value.trim(),rows:rows});
      resync(); renderCalendar(v); toast('Slot added at the bottom of the calendar.');
    });
  };
  v.querySelectorAll('[data-hide]').forEach(function(b){ b.onclick=function(){
    var sec=state.sections[+b.getAttribute('data-hide')];
    sec.hidden=!sec.hidden; resync(); renderCalendar(v);
    toast(sec.hidden?'Hidden. The history is kept; find it under "Show hidden slots".':'Slot is back on the calendar.');
  }; });
  v.querySelectorAll('td.cell').forEach(function(td){
    function open(){ openCellEditor(+td.getAttribute('data-s'),+td.getAttribute('data-r'),+td.getAttribute('data-i'),v); }
    td.onclick=open;
    td.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(); } };
  });
}
function openCellEditor(si,ri,i,v){
  var sec=state.sections[si], row=sec.rows[ri], w=weeks();
  var body='<div class="frm">'+
    '<div class="full"><label>Coffee</label><input id="ce-val" list="ce-dl" value="'+esc(cellVal(row,i))+'" placeholder="e.g. Palmera - Colombia">'+datalistHTML('ce-dl')+'</div>'+
    '<div><label>Fill forward (weeks)</label><input id="ce-n" type="number" min="1" max="'+(w.length-i)+'" value="1"></div>'+
    '<div style="align-self:end"><button class="btn ghost" id="ce-clear">Clear these weeks</button></div>'+
    '<div class="full muted" style="font-size:12px">'+esc(sec.name)+' &middot; '+esc(row.name)+' &middot; starting week of '+esc(fmtMD(w[i].start))+'. Fill forward writes the same coffee into the next weeks, like dragging in the sheet.</div>'+
  '</div>';
  var bg=openModal('Set coffee',body,function(m){
    var val=m.querySelector('#ce-val').value.trim();
    var n=Math.max(1,Math.min(w.length-i,Number(m.querySelector('#ce-n').value)||1));

  bg.querySelector('#ce-clear').onclick=function(){

    bg.querySelector('[data-x="cancel"]').click();
  };
}

    });

/* ---------- orders ---------- */
function statusChip(s){
  if(s==='transferred') return '<span class="chip good">In Cropster</span>';
  if(s==='ordered') return '<span class="chip warn">Ordered</span>';
  return '<span class="chip plain">Draft</span>';
}
function orderTotals(o){
  var bags=0,wgt=0,price=0;
  (o.lines||[]).concat(o.delivery||[]).forEach(function(l){
    var b=Number(l.bags)||0,w=b*(Number(l.bagWeight)||0);
    bags+=b; wgt+=w; price+=w*(Number(l.price)||0);
  });
  return {bags:bags,wgt:wgt,price:price};
}
function renderOrders(v){
  var showArch=v.getAttribute('data-arch')==='1';
  var list=state.orders.filter(function(o){return showArch?o.archived:!o.archived;}).slice().sort(function(a,b){return (b.date||'').localeCompare(a.date||'');});
  var html='<div class="toolbar"><h2 class="sec" style="margin:0">Orders'+(showArch?'<small>archived</small>':'')+'</h2><div class="spacer"></div>'+
    '<button class="btn" id="ord-new">New order</button>'+
    '<button class="btn ghost small" id="ord-arch">'+(showArch?'Back to current':'View archived')+'</button></div>';
  if(!list.length) html+='<div class="card muted">'+(showArch?'Nothing archived.':'No orders yet. "New order" starts one, pulling coffees straight from your position.')+'</div>';
  list.forEach(function(o){
    var t=orderTotals(o);
    html+='<div class="card order-card"><div class="order-head"><span class="nm">'+esc(o.label)+'</span>'+statusChip(o.status)+(o.deducted?'<span class="chip plain">Position updated</span>':'')+
      '<span class="tot num"><b>'+t.bags+'</b> bags &middot; '+lbs(t.wgt)+' lbs &middot; <b>'+money(t.price)+'</b></span></div>';
    if(o.note) html+='<div class="muted" style="font-size:12.5px;margin-top:4px">'+esc(o.note)+'</div>';
    html+='<div class="tblwrap" style="margin-top:8px"><table class="data"><thead><tr><th class="r">Bags</th><th>Coffee</th><th>Origin</th><th class="r">$/lb</th><th class="r">Bag wt</th><th>Importer</th><th class="r">Lbs</th><th class="r">Total</th></tr></thead><tbody>';
    (o.lines||[]).forEach(function(l){
      var w=(Number(l.bags)||0)*(Number(l.bagWeight)||0);
      html+='<tr><td class="r num">'+esc(String(l.bags))+'</td><td>'+esc(l.coffee)+'</td><td>'+esc(l.origin||'')+'</td><td class="r num">'+money(l.price)+'</td><td class="r num">'+lbs(l.bagWeight)+'</td><td>'+esc(l.importer||'')+'</td><td class="r num">'+lbs(w)+'</td><td class="r num">'+money(w*(Number(l.price)||0))+'</td></tr>';
    });
    (o.delivery||[]).forEach(function(l){
      var w=(Number(l.bags)||0)*(Number(l.bagWeight)||0);
      html+='<tr><td class="r num">'+esc(String(l.bags))+'</td><td>'+esc(l.coffee)+' <span class="chip plain">Delivery</span></td><td>'+esc(l.origin||'')+'</td><td class="r num">'+money(l.price)+'</td><td class="r num">'+lbs(l.bagWeight)+'</td><td>'+esc(l.importer||'')+'</td><td class="r num">'+lbs(w)+'</td><td class="r num">'+money(w*(Number(l.price)||0))+'</td></tr>';
    });
    html+='</tbody></table></div><div class="order-actions">'+
      '<button class="btn ghost small" data-oe="'+esc(o.id)+'">Edit</button>'+
      '<button class="btn accent small" data-omail="'+esc(o.id)+'">Draft emails</button>';
    if(o.status==='draft') html+='<button class="btn small" data-onext="'+esc(o.id)+'">Mark ordered</button>';
    if(o.status==='ordered') html+='<button class="btn small" data-onext="'+esc(o.id)+'">Mark transferred to Cropster</button>';
    if(!o.deducted) html+='<button class="btn ghost small" data-oded="'+esc(o.id)+'">Deduct bags from position</button>';
    html+='<button class="btn ghost small" data-odup="'+esc(o.id)+'">Duplicate</button>'+
      '<button class="btn ghost small" data-oarch="'+esc(o.id)+'">'+(o.archived?'Restore':'Archive')+'</button></div></div>';
  });
  v.innerHTML=html;

  v.querySelectorAll('[data-omail]').forEach(function(b){ b.onclick=function(){ openEmailDrafts(byId(b.getAttribute('data-omail'))); }; });
  v.querySelectorAll('[data-onext]').forEach(function(b){ b.onclick=function(){
    var o=byId(b.getAttribute('data-onext'));

      else misses.push(l.coffee);
    });
    o.deducted=true; markDirty(); renderOrders(v);
    toast('Deducted: '+(hits.join(', ')||'none')+(misses.length?'. Not found in position: '+misses.join(', '):''));
  }; });

    '<button class="btn ghost small" id="oe-addline" style="margin:6px 0 14px">Add pickup line</button>'+
    '<label style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint)">Delivery</label>'+
    '<div class="tblwrap"><table class="data" id="oe-dlines"><thead><tr><th>Bags</th><th>Coffee</th><th>Origin</th><th>$/lb</th><th>Bag wt</th><th>Importer</th><th class="r">Total</th><th></th></tr></thead><tbody></tbody></table></div>'+
    '<button class="btn ghost small" id="oe-adddline" style="margin:6px 0">Add delivery line</button>'+
    '<div class="statbar" id="oe-tot" style="margin-top:12px"></div>';
  var bg=openModal(id?'Edit order':'New order',body,function(m){
    o.label=m.querySelector('#oe-label').value.trim()||o.label;
    o.date=m.querySelector('#oe-date').value;
    o.status=m.querySelector('#oe-status').value;
    o.note=m.querySelector('#oe-note').value.trim();
    o.lines=readLines(m.querySelector('#oe-lines tbody'));
    o.delivery=readLines(m.querySelector('#oe-dlines tbody'));
    if(!id) state.orders.push(o);
    markDirty(); renderOrders(v);
  });
  var m=bg.querySelector('.modal-body');
  function readLines(tb){
    var out=[];
    tb.querySelectorAll('tr').forEach(function(tr){
      var coffee=tr.querySelector('.l-coffee').value.trim();
      var bagsV=tr.querySelector('.l-bags').value;
      if(!coffee&&!bagsV) return;
      out.push({bags:Number(bagsV)||0,coffee:coffee,origin:tr.querySelector('.l-origin').value.trim(),price:Number(tr.querySelector('.l-price').value)||0,bagWeight:Number(tr.querySelector('.l-bw').value)||0,importer:tr.querySelector('.l-imp').value.trim()});
    });
    return out;
  }
  function totals(){
    var t={bags:0,wgt:0,price:0};
    [m.querySelector('#oe-lines tbody'),m.querySelector('#oe-dlines tbody')].forEach(function(tb){
      tb.querySelectorAll('tr').forEach(function(tr){
        var b=Number(tr.querySelector('.l-bags').value)||0;
        var w=b*(Number(tr.querySelector('.l-bw').value)||0);
        var p=w*(Number(tr.querySelector('.l-price').value)||0);
        tr.querySelector('.l-tot').textContent=b?(lbs(w)+' lbs / '+money(p)):'';
        t.bags+=b; t.wgt+=w; t.price+=p;
      });
    });
    m.querySelector('#oe-tot').innerHTML='<div class="st"><div class="v">'+t.bags+'</div><div class="k">Bags</div></div><div class="st"><div class="v">'+lbs(t.wgt)+'</div><div class="k">Lbs</div></div><div class="st"><div class="v">'+money(t.price)+'</div><div class="k">Total</div></div>';
  }
  function wireRow(tr){
    tr.querySelector('.l-del').onclick=function(){ tr.remove(); totals(); };
    tr.querySelector('.l-coffee').addEventListener('change',function(){
      var name=this.value.trim().toLowerCase();
      var p=state.position.filter(function(x){ if(x.archived) return false; var full=(x.coffee+(x.origin?' - '+x.origin:'')).toLowerCase(); return x.coffee.toLowerCase()===name||full===name; })[0];
      if(p){
        tr.querySelector('.l-coffee').value=p.coffee;
        if(!tr.querySelector('.l-origin').value) tr.querySelector('.l-origin').value=p.origin||'';
        if(!tr.querySelector('.l-price').value) tr.querySelector('.l-price').value=p.price;
        if(!tr.querySelector('.l-bw').value) tr.querySelector('.l-bw').value=p.bagWeight;
        if(!tr.querySelector('.l-imp').value) tr.querySelector('.l-imp').value=p.importer||'';
      }
      totals();
    });
    tr.querySelectorAll('input').forEach(function(inp){ inp.addEventListener('input',totals); });
  }
  function addRow(tb,l,kind){ var tr=el('<table>'+lineRowHTML(l,kind)+'</table>').querySelector('tr'); tb.appendChild(tr); wireRow(tr); }
  (o.lines&&o.lines.length?o.lines:[{}]).forEach(function(l){ addRow(m.querySelector('#oe-lines tbody'),l,'p'); });
  (o.delivery||[]).forEach(function(l){ addRow(m.querySelector('#oe-dlines tbody'),l,'d'); });
  m.querySelector('#oe-addline').onclick=function(){ addRow(m.querySelector('#oe-lines tbody'),{},'p'); };
  m.querySelector('#oe-adddline').onclick=function(){ addRow(m.querySelector('#oe-dlines tbody'),{},'d'); };
  totals();
}

/* ---------- order emails ---------- */
function copyText(text,btn){
  var orig=btn.textContent;
  function done(){ btn.textContent='Copied'; setTimeout(function(){ btn.textContent=orig; },1600); }
  function fallback(){
    var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('Copy failed. Select the text and copy it yourself.'); }
    ta.remove();
  }
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done,fallback);
  else fallback();
}
function importerFirstName(company){
  var imp=state.importers.filter(function(i){return !i.archived&&i.company.trim().toLowerCase()===String(company||'').trim().toLowerCase();})[0];
  var c=imp&&imp.contact?imp.contact.split(',')[0].trim():'';
  return c?c.split(' ')[0]:'there';
}
function openEmailDrafts(o){
  var all=(o.lines||[]).concat(o.delivery||[]).filter(function(l){return l.coffee;});
  if(!all.length){ toast('Add some coffees to the order first.'); return; }
  var md='';
  if(o.date){ var d=parseLocalDate(o.date); md=(d.getMonth()+1)+'/'+d.getDate(); }
  var groups={}, order=[];
  all.forEach(function(l){ var k=l.importer||'Unknown importer'; if(!groups[k]){ groups[k]=[]; order.push(k); } groups[k].push(l); });
  var blocks=[];
  function lineLbs(l){ return (Number(l.bags)||0)*(Number(l.bagWeight)||0); }
  function lineCost(l){ return lineLbs(l)*(Number(l.price)||0); }
  function coffeeLabel(l){
    if(!l.origin) return l.coffee;
    /* a lot name already carries a dash, so a second one reads badly */
    return l.coffee+(String(l.coffee).indexOf(' - ')>-1?', ':' - ')+l.origin;
  }
  var po='Hey '+(state.team.poContact||'Alex')+', can I get POs for the following?\n';
  order.forEach(function(imp){
    var tot=0;
    groups[imp].forEach(function(l){ tot+=lineCost(l); });
    po+='\n'+imp+' ('+money(tot)+')\n';
    groups[imp].forEach(function(l){
      po+='('+l.bags+') '+coffeeLabel(l)+' ('+money(lineCost(l))+')\n';
    });
  });
  blocks.push({title:'1. PO request to '+(state.team.poContact||'Alex'),subject:'PO Request',body:po.trim()});
  order.forEach(function(imp){
    var b='Hey '+importerFirstName(imp)+'!\n\nHope all is well. We need some coffees released!\n\nWe need the following released:\n';
    groups[imp].forEach(function(l){ b+=l.bags+'\t'+l.coffee+'\t'+(l.origin||'')+'\n'; });
    b+='\nPO is attached for reference! Can you note for consolidation? We will be handling shipping!';
    blocks.push({title:'2. Release request to '+imp,subject:'Release Request '+md,body:b});
  });
  var bags=0,wgt=0;
  var c='Hey all!\n\nCan you consolidate:\n';
  all.forEach(function(l){
    bags+=Number(l.bags)||0; wgt+=lineLbs(l);
    var tail=[(l.origin||''),(l.importer?'('+l.importer+')':'')].filter(Boolean).join(' ');
    c+=l.bags+'\t'+l.coffee+'\t'+tail+'\n';
  });
  c+='\nnumber of bags - '+bags+'\nweight of the coffee - '+Math.round(wgt).toLocaleString('en-US')+'lbs\n\nThey should all be sent in today and tomorrow morning! Thank you.';
  blocks.push({title:'3. Consolidation to the annex',subject:'Shipment/Consolidation '+md,body:c});
  var body='<p class="muted" style="margin-top:0;font-size:12.5px">Three steps: PO request first, then a release email per importer, then the consolidation email to the annex. Tweak the text right here, then copy and paste into Gmail. Nothing sends from this page.</p>';
  blocks.forEach(function(bl,i){
    var rows=Math.min(14,bl.body.split('\n').length+1);
    body+='<div class="email-block"><div class="eb-head"><span class="eb-title">'+esc(bl.title)+'</span><span class="eb-subject">Subject: '+esc(bl.subject)+'</span><button class="btn ghost small" data-copy="'+i+'" style="margin-left:auto">Copy</button></div>'+
      '<textarea data-body="'+i+'" rows="'+rows+'">'+esc(bl.body)+'</textarea></div>';
  });
  var bg=openModal('Emails for '+o.label,body,null);
  bg.querySelectorAll('[data-copy]').forEach(function(btn){
    btn.onclick=function(){ copyText(bg.querySelector('textarea[data-body="'+btn.getAttribute('data-copy')+'"]').value,btn); };
  });
}

/* ---------- importers ---------- */
function actChip(a){
  if(a==='Very Active') return '<span class="chip good">Very active</span>';
  if(a==='Semi Active') return '<span class="chip warn">Semi active</span>';
  if(a==='Non-Active') return '<span class="chip plain">Not active</span>';
  return '';
}
function renderImporters(v){
  var showArch=v.getAttribute('data-arch')==='1';
  var list=state.importers.filter(function(i){return showArch?i.archived:!i.archived;});
  var html='<div class="toolbar"><h2 class="sec" style="margin:0">Importers'+(showArch?'<small>archived</small>':'')+'</h2><div class="spacer"></div>'+
    '<button class="btn" id="imp-add">Add importer</button>'+
    '<button class="btn ghost small" id="imp-arch">'+(showArch?'Back to current':'View archived')+'</button></div><div class="imp-cards">';
  list.forEach(function(imp){
    html+='<div class="card imp-card"><div style="display:flex;gap:8px;align-items:center"><span class="co">'+esc(imp.company)+'</span><span style="margin-left:auto">'+actChip(imp.activity)+'</span></div>';
    if(imp.contact) html+='<div class="row"><b>'+esc(imp.contact)+'</b></div>';
    if(imp.origins) html+='<div class="row">'+esc(imp.origins)+'</div>';
    (imp.emails||[]).forEach(function(e2){ html+='<div class="row"><a href="mailto:'+esc(e2)+'">'+esc(e2)+'</a></div>'; });
    if(imp.phone) html+='<div class="row num">'+esc(imp.phone)+'</div>';
    if(imp.note) html+='<div class="row faint">'+esc(imp.note)+'</div>';
    html+='<div style="margin-top:10px"><button class="btn ghost small" data-ie="'+esc(imp.id)+'">Edit</button> <button class="btn ghost small" data-ia="'+esc(imp.id)+'">'+(imp.archived?'Restore':'Archive')+'</button></div></div>';
  });
  html+='</div>';
  if(!list.length) html+='<div class="card muted" style="margin-top:12px">'+(showArch?'Nothing archived.':'No importers yet.')+'</div>';
  v.innerHTML=html;
  v.querySelector('#imp-add').onclick=function(){ openImporterEditor(null,v); };
  v.querySelector('#imp-arch').onclick=function(){ v.setAttribute('data-arch',showArch?'0':'1'); renderImporters(v); };
  v.querySelectorAll('[data-ie]').forEach(function(b){ b.onclick=function(){ openImporterEditor(b.getAttribute('data-ie'),v); }; });
  v.querySelectorAll('[data-ia]').forEach(function(b){ b.onclick=function(){
    var i=state.importers.filter(function(x){return x.id===b.getAttribute('data-ia');})[0];
    if(i){ i.archived=!i.archived; markDirty(); renderImporters(v); }
  }; });
}
function openImporterEditor(id,v){
  var i=id?state.importers.filter(function(x){return x.id===id;})[0]:{id:uid(),company:'',contact:'',activity:'',origins:'',emails:[],phone:'',note:''};
  var body='<div class="frm">'+
    '<div><label>Company</label><input id="ie-co" value="'+esc(i.company)+'"></div>'+
    '<div><label>Contact(s)</label><input id="ie-ct" value="'+esc(i.contact||'')+'"></div>'+
    '<div><label>Activity</label><select id="ie-act"><option value=""'+(!i.activity?' selected':'')+'>Unknown</option><option'+(i.activity==='Very Active'?' selected':'')+'>Very Active</option><option'+(i.activity==='Semi Active'?' selected':'')+'>Semi Active</option><option'+(i.activity==='Non-Active'?' selected':'')+'>Non-Active</option></select></div>'+
    '<div><label>Phone</label><input id="ie-ph" value="'+esc(i.phone||'')+'"></div>'+
    '<div class="full"><label>Origin offerings</label><input id="ie-or" value="'+esc(i.origins||'')+'"></div>'+
    '<div class="full"><label>Emails (comma separated)</label><input id="ie-em" value="'+esc((i.emails||[]).join(', '))+'"></div>'+
    '<div class="full"><label>Note</label><input id="ie-no" value="'+esc(i.note||'')+'" placeholder="MOQ, terms, anything useful"></div>'+
  '</div>';
  openModal(id?'Edit importer':'Add importer',body,function(m){
    if(!m.querySelector('#ie-co').value.trim()){ toast('Company name is required.'); return false; }
    i.company=m.querySelector('#ie-co').value.trim();
    i.contact=m.querySelector('#ie-ct').value.trim();
    i.activity=m.querySelector('#ie-act').value;
    i.phone=m.querySelector('#ie-ph').value.trim();
    i.origins=m.querySelector('#ie-or').value.trim();
    i.emails=m.querySelector('#ie-em').value.split(',').map(function(s){return s.trim();}).filter(Boolean);
    i.note=m.querySelector('#ie-no').value.trim();
    if(!id) state.importers.push(i);
    markDirty(); renderImporters(v);
  });
}

/* ---------- settings ---------- */
function renderSettings(v){
  var html='<div class="two-col"><div><h2 class="sec">Emails</h2><div class="card"><div class="frm"><div><label>PO requests go to</label><input id="st-po" value="'+esc(state.team.poContact||'')+'" placeholder="Alex"></div><div class="full muted" style="font-size:12px">Used in the "Draft emails" button on every order.</div></div></div>'+
  '<h2 class="sec">Weekly usage<small>category averages, shown on the calendar</small></h2><div class="card tblwrap"><table class="data"><thead><tr><th>Category</th><th class="r">Lbs per week</th></tr></thead><tbody>';
  state.usage.forEach(function(u,idx){ html+='<tr><td>'+esc(u.label)+'</td><td class="r"><input type="number" min="0" data-u="'+idx+'" value="'+esc(u.lbs)+'" style="width:100px;text-align:right"></td></tr>'; });
  html+='</tbody></table></div>'+
  '<h2 class="sec">Minimum inventory<small>reorder trigger, lbs on hand</small></h2><div class="card tblwrap"><table class="data"><thead><tr><th>Category</th><th class="r">Minimum lbs</th></tr></thead><tbody>';
  state.minimums.forEach(function(u2,idx){ html+='<tr><td>'+esc(u2.label)+'</td><td class="r"><input type="number" min="0" data-m="'+idx+'" value="'+esc(u2.lbs)+'" style="width:100px;text-align:right"></td></tr>'; });
  html+='</tbody></table></div></div>'+
  '<div><h2 class="sec">Team access</h2><div class="card" id="st-team"><span class="muted">Loading team list&hellip;</span></div>'+
  '<h2 class="sec">Data</h2><div class="card">'+
  '<p class="muted" style="margin-top:0">Everything saves automatically and syncs to the whole team in seconds. Download a backup anytime; it restores with Import.</p>'+
  '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
  '<button class="btn ghost" id="st-export">Download backup</button>'+
  '<button class="btn ghost" id="st-import">Import backup</button>'+
  '</div></div>'+
  '<h2 class="sec">How this works</h2><div class="card muted" style="font-size:13px">'+
  '<p style="margin-top:0"><b>Calendar</b>: click any cell to set a coffee and fill it forward. Switch weeks highlight automatically, no more manual red text. Seasonal slot done for the year? "Hide" keeps its full history and takes it off the board; bring it back anytime with "Show hidden slots".</p>'+
  '<p><b>Position</b>: book coffees as you contract them. When an order lands, use "Deduct bags from position" on the order so the position stays true.</p>'+
  '<p><b>Runway</b>: every coffee on the calendar for the next 6 weeks shows up on the dashboard by itself, with its weekly usage and minimum worked out from the plan. Enter on-hand lbs from Cropster and the Order column tells you how many bags to buy to land one week of usage above the minimum. Bag sizes come from the position, so book a coffee there to get bags instead of pounds.</p>'+
  '<p><b>Order emails</b>: "Draft emails" on any order writes the PO request, the release email for each importer, and the consolidation email for the annex. Copy, paste into Gmail, send. Nothing sends from this page.</p>'+
  '<p style="margin-bottom:0"><b>Saving</b>: automatic. Every edit saves within a couple seconds and shows up live for everyone with the app open. The header shows who saved last.</p>'+
  '</div></div></div>';
  v.innerHTML=html;
  v.querySelector('#st-po').onchange=function(){ state.team.poContact=this.value.trim()||'Alex'; markDirty(); };
  v.querySelectorAll('input[data-u]').forEach(function(inp){ inp.onchange=function(){ state.usage[+inp.getAttribute('data-u')].lbs=Number(inp.value)||0; resync(); }; });
  v.querySelectorAll('input[data-m]').forEach(function(inp){ inp.onchange=function(){ state.minimums[+inp.getAttribute('data-m')].lbs=Number(inp.value)||0; resync(); }; });
  loadTeamCard(v.querySelector('#st-team'));
  v.querySelector('#st-export').onclick=function(){
    var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='green-room-backup-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); },5000);
  };
  v.querySelector('#st-import').onclick=function(){
    openModal('Import backup','<p class="muted" style="margin-top:0">Paste a backup JSON below. It replaces everything currently in the app (you still have to hit save).</p><textarea id="imp-json" rows="12" style="width:100%"></textarea>',function(m){
      try{
        var s=JSON.parse(m.querySelector('#imp-json').value);
        if(!s.sections||!s.position) throw new Error('bad');
        state=s; normalize(state); _weeks=null; markDirty(); render(); toast('Imported. Review, then save.');
      }catch(e){ toast('That does not look like a Green Room backup.'); return false; }
    },'Import');
  };
}
/* Team access: the list of Google emails allowed into the app.
   Stored at config/access; Shane's emails are also hardcoded into the
   security rules so he can never lock himself out. */
function loadTeamCard(card){
  getDoc(ACCESS_REF).then(function(snap){
    var emails=(snap.exists()&&snap.data().emails)||[];
    renderTeamCard(card,emails);
  }).catch(function(){ card.innerHTML='<span class="muted">Could not load the team list. Refresh to retry.</span>'; });
}
function renderTeamCard(card,emails){
  var html='<p class="muted" style="margin-top:0">Anyone on this list can sign in with their Google account and use the app. Owners (Shane) always have access.</p>';
  emails.forEach(function(e2,i){
    html+='<div style="display:flex;gap:8px;align-items:center;padding:4px 0"><span>'+esc(e2)+'</span><button class="btn ghost small" data-rm="'+i+'" style="margin-left:auto">Remove</button></div>';
  });
  if(!emails.length) html+='<div class="muted" style="padding:4px 0">Nobody added yet, just the owner emails.</div>';
  html+='<div style="display:flex;gap:8px;margin-top:10px"><input id="team-new" type="email" placeholder="teammate@gmail.com" style="flex:1"><button class="btn" id="team-add">Add</button></div>';
  card.innerHTML=html;
  function saveList(next){
    setDoc(ACCESS_REF,{emails:next}).then(function(){ renderTeamCard(card,next); toast('Team list updated.'); })
      .catch(function(){ toast('Could not update the team list.'); });
  }
  card.querySelector('#team-add').onclick=function(){
    var e2=card.querySelector('#team-new').value.trim().toLowerCase();
    if(!e2||e2.indexOf('@')<1){ toast('Enter a full email address.'); return; }
    if(emails.indexOf(e2)>-1){ toast('Already on the list.'); return; }
    saveList(emails.concat([e2]));
  };
  card.querySelectorAll('[data-rm]').forEach(function(b){
    b.onclick=function(){ var next=emails.slice(); next.splice(+b.getAttribute('data-rm'),1); saveList(next); };
  });
}

/* ---------- router ---------- */
function render(){
  if(!user){ renderSignIn(); return; }
  if(noAccess){ renderNoAccess(); return; }
  if(!state) return;
  shell();
  var v=document.getElementById('view');
  if(view==='calendar') renderCalendar(v);
  else if(view==='position') renderPosition(v);
  else if(view==='orders') renderOrders(v);
  else if(view==='importers') renderImporters(v);
  else if(view==='settings') renderSettings(v);
  else renderDashboard(v);
}
window.addEventListener('hashchange',function(){ var h=location.hash.replace('#',''); if(h&&h!==view){ view=h; render(); } });
</script>
